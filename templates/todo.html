<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>To-Do</title>
  </head>
  <body>
    <h1>To-Do Page</h1>
    <form action="/submittodoitem" method="post">

      <div>
        <label>Item ID</label>
        <input type="number" name="itemId" required>
      </div>

      <div>
        <label>Item UUID</label>
        <input type="text" name="itemUuid">
      </div>

      <div>
        <label>Item Hash</label>
        <input type="text" name="itemHash">
      </div>

      <div>
        <label>Item Name</label>
        <input type="text" name="itemName" required>
      </div>

      <div>
        <label>Item Description</label>
        <textarea name="itemDescription" required></textarea>
      </div>

      <button type="submit">Submit</button>
    </form>
  </body>
</html>
